name: SRRAPIV native integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: srrapiv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-runtime:
    name: Native local profile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cxx: clang++-18
          - os: ubuntu-24.04-arm
            cxx: clang++-18
          - os: macos-15-intel
            cxx: /usr/bin/clang++
    env:
      CXX: ${{ matrix.cxx }}
      GOWORK: 'off'
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/qxctl/go.mod
          cache: false
      - name: Select Apple C++26 toolchain
        if: runner.os == 'macOS'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Build and check the local runtime
        shell: bash
        run: |
          set -euo pipefail
          cmake -S modules/srrapiv-runtime-cpp -B "$RUNNER_TEMP/srrapiv-build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/srrapiv-install"
          cmake --build "$RUNNER_TEMP/srrapiv-build" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/srrapiv-build" --output-on-failure
          cmake --install "$RUNNER_TEMP/srrapiv-build"
      - name: Check installed qxctl control and schemas
        working-directory: tools/qxctl
        env:
          SRRAPIV_TEST_PREFIX: ${{ runner.temp }}/srrapiv-install
        run: go test -count=1 ./internal/knowledgeengine ./cmd/qxctl -run 'TestSRRAPIV'
      - name: Report scope
        if: always()
        run: echo 'This gate exercises the SDK-free native control profile and test-only slow SDK fixture. It never downloads proprietary SDKs, initializes Rithmic, logs in or places orders. SDK linkage and live-provider acceptance require separately recorded evidence.' >> "$GITHUB_STEP_SUMMARY"
