name: Linux Secret Service provider

on:
  pull_request:
    paths:
      - 'modules/secure-identity-access-governance/platform/linux-secret-service/**'
      - '.github/workflows/linux-secret-service.yml'
  push:
    branches: [main]
    paths:
      - 'modules/secure-identity-access-governance/platform/linux-secret-service/**'
      - '.github/workflows/linux-secret-service.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: modules/secure-identity-access-governance/platform/linux-secret-service
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Linux Secret Service development and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsecret-1-dev gnome-keyring dbus-daemon libglib2.0-bin
          case "${{ matrix.os }}" in ubuntu-26.04) echo 'CXX=clang++-21' ;; *) echo 'CXX=clang++-18' ;; esac >> "$GITHUB_ENV"
      - name: Build the native backend and install its SDK
        run: |
          cmake -S . -B "$RUNNER_TEMP/build" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/install"
          cmake --build "$RUNNER_TEMP/build" --parallel 2
          cmake --install "$RUNNER_TEMP/build"
      - name: Exercise the installed consumer using a private keyring
        run: |
          cmake -S tests/installed -B "$RUNNER_TEMP/consumer" -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/install"
          cmake --build "$RUNNER_TEMP/consumer" --parallel 2
          timeout -k 5s 40s bash tests/private-session.sh "$RUNNER_TEMP/consumer/installed-consumer"
          cmake --build "$RUNNER_TEMP/build" --target uninstall-ssiag-linux-secret-service
