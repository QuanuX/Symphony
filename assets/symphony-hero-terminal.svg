  <!-- Outer Frame -->
  <rect width="960" height="920" fill="#050607" stroke="#1e2227" stroke-width="2"/>
  <rect width="960" height="920" fill="url(#heroGlow)"/>

  <!-- Top Spectral Bar -->
  <rect x="1" y="1" width="958" height="4" fill="url(#spectralBar)"/>

  <!-- Topbar Header -->
  <line x1="1" y1="84" x2="959" y2="84" stroke="#1e2227" stroke-width="1"/>

  <!-- BrandMark Q -->
  <rect x="40" y="24" width="38" height="38" rx="9" fill="#080a0b" stroke="#72f6ff" stroke-width="1.2"/>
  <text x="59" y="49" fill="#f6f7f8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="900" text-anchor="middle">Q</text>
  <text x="90" y="41" fill="#f6f7f8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" letter-spacing="-0.5">QuanuX</text>
  <text x="90" y="57" fill="#858b92" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" letter-spacing="3">VENTURES</text>

  <!-- Status Pill -->
  <rect x="614" y="26" width="306" height="34" rx="17" fill="#0b0d0f" stroke="#262b31" stroke-width="1"/>
  <circle cx="634" cy="43" r="4" fill="#d7ff69"/>
  <text x="648" y="47" fill="#dfe4e8" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" letter-spacing="1.1">PUBLIC BETA // v0.2.0-beta.2</text>

  <!-- Hero Eyebrow -->
  <text x="40" y="132" fill="#72f6ff" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" letter-spacing="2">VECTOR-GRAPH APPLICATION ARCHITECTURE // OPEN-SOURCE QUANTOS</text>
  <text x="40" y="160" fill="#858b92" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="2.4">QUANUX FLAGSHIP OPERATING SYSTEM</text>

  <!-- Hero Title -->
  <text x="40" y="222" fill="url(#spectralWord)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-2.5">Symphony.</text>

  <!-- Hero Kicker -->
  <text x="40" y="266" fill="#f6f7f8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.4">A quantOS for quantitative research, trading systems,</text>
  <text x="40" y="295" fill="#f6f7f8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.4">and user-owned sovereign infrastructure.</text>

  <!-- Hero Description -->
  <text x="40" y="340" fill="#b6bbc0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">Developed through <tspan fill="#f6f7f8" font-weight="700">VGAA — Vector-Graph Application Architecture</tspan>, <tspan fill="#72f6ff">QuanuX Symphony</tspan> organizes</text>
  <text x="40" y="363" fill="#b6bbc0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">quantitative data, replay, hardware and infrastructure knowledge, and explicit governance across</text>
  <text x="40" y="386" fill="#b6bbc0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">independently installed <tspan fill="#f6f7f8" font-weight="700">C++26</tspan>, <tspan fill="#f6f7f8" font-weight="700">Go 1.26.5</tspan>, and <tspan fill="#f6f7f8" font-weight="700">Swift</tspan> modules administered through <tspan fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace">qxctl</tspan>.</text>
  <text x="40" y="409" fill="#b6bbc0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5">Your strategy logic, provider choices, hardware, and deployment topology remain under your control.</text>

