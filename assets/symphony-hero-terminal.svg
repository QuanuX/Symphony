  <rect x="64" y="658" width="832" height="192" fill="#080a0b" stroke="#1e2227" stroke-width="1"/>
  <rect x="65" y="659" width="830" height="36" fill="#0b0d0f"/>
  <line x1="64" y1="695" x2="896" y2="695" stroke="#1e2227" stroke-width="1"/>
  <line x1="64" y1="734" x2="896" y2="734" stroke="#181c20" stroke-width="1"/>
  <line x1="64" y1="773" x2="896" y2="773" stroke="#181c20" stroke-width="1"/>
  <line x1="64" y1="812" x2="896" y2="812" stroke="#181c20" stroke-width="1"/>

  <text x="80" y="681" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" letter-spacing="0.8">VECTOR // DOMAIN</text>
  <text x="272" y="681" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" letter-spacing="0.8">AVAILABLE REPOSITORY CAPABILITY</text>
  <text x="880" y="681" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" letter-spacing="0.8" text-anchor="end">BOUNDARY</text>

  <!-- Row 1 -->
  <text x="80" y="719" fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">SQV · SBV · SRRAPIV</text>
  <text x="272" y="719" fill="#d8dcdf" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">Capture, metadata, flow, replay, bounded backtest &amp; R API+ runtime</text>
  <text x="880" y="719" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" letter-spacing="1.2" text-anchor="end">NATIVE C++</text>

  <!-- Row 2 -->
  <text x="80" y="758" fill="#8f7cff" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">SCV · SHV · SNV</text>
  <text x="272" y="758" fill="#d8dcdf" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">Cloud &amp; traceable hardware catalogues, 5 Node engines &amp; DuckDB</text>
  <text x="880" y="758" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" letter-spacing="1.2" text-anchor="end">PROVENANCE</text>

  <!-- Row 3 -->
  <text x="80" y="797" fill="#ff69c6" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">SSIAG · STAV</text>
  <text x="272" y="797" fill="#d8dcdf" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">Authorization policy, provider bindings &amp; append-only audit ledger</text>
  <text x="880" y="797" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" letter-spacing="1.2" text-anchor="end">GOVERNED</text>

  <!-- Row 4 -->
  <text x="80" y="836" fill="#ffb45f" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">SKV · SAV · Maestro</text>
  <text x="272" y="836" fill="#d8dcdf" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5">Contract Quad, C++26 validator, Accordare &amp; engine presence</text>
  <text x="880" y="836" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" letter-spacing="1.2" text-anchor="end">EXPLICIT</text>

  <!-- Bottom Spectral Divider -->
  <rect x="40" y="902" width="880" height="1.5" fill="url(#dividerRule)"/>
