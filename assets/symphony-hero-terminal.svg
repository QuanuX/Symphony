  <circle cx="62" cy="566" r="4.5" fill="#ff6d71"/>
  <circle cx="76" cy="566" r="4.5" fill="#ffd35f"/>
  <circle cx="90" cy="566" r="4.5" fill="#6fe787"/>

  <text x="480" y="570" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" letter-spacing="1" text-anchor="middle">qxctl // vgaa domain vectors &amp; source smoke check</text>
  <text x="900" y="570" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" letter-spacing="1.2" text-anchor="end">● FEATURE FREEZE</text>

