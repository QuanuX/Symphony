  <rect x="40" y="436" width="880" height="76" fill="#080a0b" stroke="#1e2227" stroke-width="1"/>
  <line x1="260" y1="436" x2="260" y2="512" stroke="#1e2227" stroke-width="1"/>
  <line x1="480" y1="436" x2="480" y2="512" stroke="#1e2227" stroke-width="1"/>
  <line x1="700" y1="436" x2="700" y2="512" stroke="#1e2227" stroke-width="1"/>

  <text x="56" y="462" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10" letter-spacing="1.2">PUBLIC BETA RELEASE</text>
  <text x="56" y="483" fill="#f6f7f8" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5" font-weight="700">v0.2.0-beta.2</text>
  <text x="56" y="500" fill="#f6f7f8" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5" font-weight="700">4 Qualified OS Profiles</text>

  <text x="276" y="462" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10" letter-spacing="1.2">COMMAND REGISTRY</text>
  <text x="276" y="483" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5" font-weight="700">525 Stable Commands</text>
  <text x="276" y="500" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5" font-weight="700">qxctl · Go 1.26.5 CLI</text>

  <text x="496" y="462" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10" letter-spacing="1.2">SSFV SNAPSHOT</text>
  <text x="496" y="483" fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5" font-weight="700">154 Registered Features</text>
  <text x="496" y="500" fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5" font-weight="700">69 Owner Scopes · 427 Gates</text>

  <text x="716" y="462" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="10" letter-spacing="1.2">HOT-PATH DOCTRINE</text>
  <text x="716" y="483" fill="#ff69c6" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5" font-weight="700">Cold-Path Control Plane</text>
  <text x="716" y="500" fill="#ff69c6" font-family="'SFMono-Regular', Consolas, monospace" font-size="11.5" font-weight="700">Zero First-Party Python</text>

  <!-- Terminal Window -->
  <rect x="40" y="544" width="880" height="330" rx="10" fill="#080a0b" stroke="#262b31" stroke-width="1.2"/>
  <rect x="41" y="545" width="878" height="42" rx="9" fill="#0b0d0f"/>
  <line x1="40" y1="587" x2="920" y2="587" stroke="#1e2227" stroke-width="1"/>

