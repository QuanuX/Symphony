  <text x="64" y="618" fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace" font-size="12.5">$</text>
  <text x="80" y="618" fill="#f6f7f8" font-family="'SFMono-Regular', Consolas, monospace" font-size="12.5">sh tests/launch-acceptance/source-smoke.sh "$work/qxctl" "$repo" "$work/evidence"</text>
  <text x="64" y="640" fill="#858b92" font-family="'SFMono-Regular', Consolas, monospace" font-size="11"># Reporting executable identity, invariant registry, and independently installed C++26 / Go / Swift boundaries</text>

