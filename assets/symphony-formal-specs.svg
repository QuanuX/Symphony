  <text x="504" y="284" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5">• <tspan fill="#f6f7f8" font-weight="600">Beta.2 Lifecycle Repairs:</tspan> Dependency replacement order,</text>
  <text x="516" y="304" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5">idempotent scoped-close retry, and owner reinstall.</text>

