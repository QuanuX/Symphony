  <text x="504" y="192" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5">• <tspan fill="#f6f7f8" font-weight="600">Quantitative &amp; Connections:</tspan> <tspan fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace">SQV</tspan>, <tspan fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace">SBV</tspan>, <tspan fill="#72f6ff" font-family="'SFMono-Regular', Consolas, monospace">SOOV</tspan> (FIX),</text>
