  <!-- Left Card -->
  <text x="64" y="136" fill="#d7ff69" font-family="'SFMono-Regular', Consolas, monospace" font-size="10.5" letter-spacing="1.4">CONTROL &amp; KNOWLEDGE SPINE // COLD-PATH</text>
  <text x="64" y="164" fill="#f6f7f8" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="700">qxctl, Coordinator, Maestro &amp; Validator</text>
  <text x="64" y="192" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5">• <tspan fill="#f6f7f8" font-weight="600">qxctl &amp; C++ Foundation:</tspan> Owns CLI grammar, bounded framing,</text>
  <text x="76" y="212" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5">JSON, hashes, manifests, and owned-file install receipts.</text>
  <text x="64" y="238" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5">• <tspan fill="#f6f7f8" font-weight="600">Session Coordinator &amp; Maestro:</tspan> Manages bounded sessions,</text>
  <text x="76" y="258" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5">lifecycle plans/journals, and authenticated engine presence.</text>
  <text x="64" y="284" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5">• <tspan fill="#f6f7f8" font-weight="600">symphony-validator:</tspan> Deterministic read-only repository</text>
  <text x="76" y="304" fill="#989ea4" font-family="Inter, -apple-system, sans-serif" font-size="12.5">assurance across SKV, SKVI, SCLV, SACV, SODV, and SSFV.</text>

