  <text x="64" y="772" fill="#f6f7f8" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="700">Zero First-Party Python · Machine-Checked Snapshot · AGPL-3.0-only</text>
  <text x="64" y="800" fill="#b6bbc0" font-family="Inter, -apple-system, sans-serif" font-size="13.5">QuanuX stewards official source truth; private Symphony/TOPS installations retain their own declared and observed state.</text>
  <text x="64" y="822" fill="#b6bbc0" font-family="Inter, -apple-system, sans-serif" font-size="13.5">Installing packages or compiling from source never activates a live service, opens Keychain, or grants provider authority.</text>

